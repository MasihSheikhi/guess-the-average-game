<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding: 20px; }
        .chart-container, .winner-card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); margin-bottom: 20px; }
        .winner-card h2 { color: #28a745; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">Results Dashboard</h1>

        <div class="chart-container">
            <h2 class="h4 mb-3">Distribution of Guesses</h2>
            <img src="data:image/png;base64,{{ plot_url }}" alt="Distribution Chart" class="img-fluid rounded">
        </div>

        <div class="row mt-4">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title text-muted">Average Guess</h5>
                        <p class="card-text fs-3 fw-bold">{{ average | round(2) }}</p>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title text-muted">Two-Thirds of the Average</h5>
                        <p class="card-text fs-3 fw-bold">{{ two_thirds_avg | round(2) }}</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="winner-card text-center mt-4">
            <h2>🏆 Winner</h2>
            <p class="fs-5 mt-3"><strong>Name:</strong> {{ winner[0] }}</p>
            <p class="fs-5"><strong>Guess:</strong> {{ winner[1] }}</p>
            <p class="text-success fw-bold fs-4 mt-3">Congratulations!</p>
            <a href="/" class="btn btn-primary mt-3">Start New Round</a>
        </div>
    </div>
</body>
</html>
