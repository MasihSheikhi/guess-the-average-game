<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Result - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding: 20px; }
        .container { max-width: 400px; margin-top: 50px; }
        .card { border: none; border-radius: 10px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header bg-dark text-white text-center">
                <h4>Admin Access</h4>
            </div>
            <div class="card-body">
                <p class="text-muted text-center">Only developers have access to this section.</p>
                <form action="/final_result" method="POST">
                    <div class="mb-3">
                        <label for="password" class="form-label">Password:</label>
                        <input type="password" id="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-dark w-100">Submit</button>
                </form>
                <div class="text-center mt-3">
                    <a href="/" class="text-decoration-none">Back to Game</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
